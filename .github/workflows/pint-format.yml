name: Laravel Pint

on:
  push:
    branches: [main]
    paths:
      - 'composer.json'
      - '**/*.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Install development dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Format PHP files
        run: vendor/bin/pint
      - name: Commit formatting changes
        shell: bash
        run: |
          git add -u -- '*.php'
          if git diff --cached --quiet; then
            echo "Pint found no formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Laravel Pint formatting"
          git push
